<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد آشپزخانه</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', Tahoma, sans-serif; }
    .order-new { border-right: 4px solid #3b82f6; }
    .order-cooking { border-right: 4px solid #eab308; }
    .order-ready { border-right: 4px solid #22c55e; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">👨‍🍳</span>
        <div>
          <h1 class="font-bold text-lg" id="restoName">داشبورد آشپزخانه</h1>
          <p class="text-xs text-gray-400">سفارش‌های فعال</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-sm text-gray-400" id="lastUpdate">—</span>
        <button onclick="loadOrders()" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm">بروزرسانی</button>
        <label class="flex items-center gap-2 text-sm text-gray-400">
          <input type="checkbox" id="autoRefresh" checked class="rounded">
          خودکار (۱۰ ثانیه)
        </label>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- Status filters -->
    <div class="flex gap-2 mb-6 flex-wrap">
      <button onclick="setFilter('active')" id="f-active" class="px-4 py-1.5 rounded-full text-sm bg-orange-600">فعال</button>
      <button onclick="setFilter('جدید')" id="f-جدید" class="px-4 py-1.5 rounded-full text-sm bg-gray-700 hover:bg-gray-600">جدید</button>
      <button onclick="setFilter('در حال آماده‌سازی')" id="f-cooking" class="px-4 py-1.5 rounded-full text-sm bg-gray-700 hover:bg-gray-600">در حال آماده‌سازی</button>
      <button onclick="setFilter('آماده')" id="f-ready" class="px-4 py-1.5 rounded-full text-sm bg-gray-700 hover:bg-gray-600">آماده</button>
      <button onclick="setFilter('all')" id="f-all" class="px-4 py-1.5 rounded-full text-sm bg-gray-700 hover:bg-gray-600">همه</button>
    </div>

    <div id="ordersGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
      <p class="text-gray-500 col-span-full text-center py-20">در حال بارگذاری...</p>
    </div>
  </main>

  <script>
    const rid = localStorage.getItem('resto_id');
    if (!rid) {
      // allow access without login for kitchen (or redirect)
      document.getElementById('restoName').textContent = 'آشپزخانه (ورود نشده)';
    } else {
      document.getElementById('restoName').textContent = (localStorage.getItem('resto_name') || '') + ' — آشپزخانه';
    }

    let currentFilter = 'active';
    let refreshTimer = null;

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('[id^="f-"]').forEach(el => {
        el.className = 'px-4 py-1.5 rounded-full text-sm bg-gray-700 hover:bg-gray-600';
      });
      const map = { active: 'f-active', 'جدید': 'f-جدید', 'در حال آماده‌سازی': 'f-cooking', 'آماده': 'f-ready', all: 'f-all' };
      const el = document.getElementById(map[f]);
      if (el) el.className = 'px-4 py-1.5 rounded-full text-sm bg-orange-600';
      loadOrders();
    }

    async function loadOrders() {
      if (!rid) {
        document.getElementById('ordersGrid').innerHTML = '<p class="text-red-400 col-span-full text-center py-20">لطفاً اول از پنل رستوران وارد شوید</p>';
        return;
      }

      let url = `/api/restaurants/${rid}/orders`;
      if (currentFilter === 'active') {
        url += '?status=' + encodeURIComponent('جدید,در حال آماده‌سازی,آماده');
      } else if (currentFilter !== 'all') {
        url += '?status=' + encodeURIComponent(currentFilter);
      }

      try {
        const res = await fetch(url);
        const orders = await res.json();
        renderOrders(orders);
        document.getElementById('lastUpdate').textContent = 'آخرین بروزرسانی: ' + new Date().toLocaleTimeString('fa-IR');
      } catch (e) {
        console.error(e);
      }
    }

    function renderOrders(orders) {
      const grid = document.getElementById('ordersGrid');
      if (!orders.length) {
        grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-20">سفارش فعالی وجود ندارد 🎉</p>';
        return;
      }

      const borderClass = {
        'جدید': 'order-new',
        'در حال آماده‌سازی': 'order-cooking',
        'آماده': 'order-ready'
      };

      grid.innerHTML = orders.map(o => {
        const age = Math.round((Date.now() - new Date(o.created_at)) / 60000);
        return `
          <div class="bg-gray-800 rounded-xl p-5 ${borderClass[o.status] || ''}">
            <div class="flex justify-between items-start mb-3">
              <div>
                <span class="text-xl font-bold">${o.table_label}</span>
                <span class="text-xs text-gray-400 mr-2">${age} دقیقه پیش</span>
              </div>
              <span class="text-xs px-2 py-1 rounded-full bg-gray-700">${o.status}</span>
            </div>

            <ul class="space-y-1.5 mb-4">
              ${o.items.map(i => `
                <li class="flex justify-between text-sm">
                  <span>${i.name} <span class="text-orange-400 font-bold">×${i.qty}</span></span>
                </li>
              `).join('')}
            </ul>

            ${o.note ? `<p class="text-xs text-yellow-400/80 mb-3 bg-yellow-400/10 rounded px-2 py-1">📝 ${o.note}</p>` : ''}

            <div class="flex gap-2 flex-wrap">
              ${o.status === 'جدید' ? `
                <button onclick="setStatus('${o.id}', 'در حال آماده‌سازی')" class="flex-1 bg-yellow-600 hover:bg-yellow-500 text-sm py-2 rounded-lg">شروع آماده‌سازی</button>
              ` : ''}
              ${o.status === 'در حال آماده‌سازی' ? `
                <button onclick="setStatus('${o.id}', 'آماده')" class="flex-1 bg-green-600 hover:bg-green-500 text-sm py-2 rounded-lg">آماده شد</button>
              ` : ''}
              ${o.status === 'آماده' ? `
                <button onclick="setStatus('${o.id}', 'تحویل شده')" class="flex-1 bg-gray-600 hover:bg-gray-500 text-sm py-2 rounded-lg">تحویل شد</button>
              ` : ''}
              ${['جدید','در حال آماده‌سازی'].includes(o.status) ? `
                <button onclick="setStatus('${o.id}', 'لغو')" class="px-3 bg-red-900/50 hover:bg-red-800 text-red-300 text-sm py-2 rounded-lg">لغو</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function setStatus(orderId, status) {
      await fetch(`/api/orders/${orderId}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadOrders();
    }

    // Auto refresh
    function setupAuto() {
      clearInterval(refreshTimer);
      if (document.getElementById('autoRefresh').checked) {
        refreshTimer = setInterval(loadOrders, 10000);
      }
    }
    document.getElementById('autoRefresh').addEventListener('change', setupAuto);

    loadOrders();
    setupAuto();
  </script>
</body>
</html>
