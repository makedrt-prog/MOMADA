<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>منوی رستوران</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', Tahoma, sans-serif; }
    .cat-active { background: #ea580c; color: white; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen pb-28">
  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-20">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="font-bold text-lg text-gray-800" id="restoTitle">منو</h1>
        <p class="text-xs text-gray-500" id="tableLabel"></p>
      </div>
      <div class="text-2xl">🍽️</div>
    </div>
    <!-- Categories scroll -->
    <div id="catBar" class="flex gap-2 px-4 pb-3 overflow-x-auto scrollbar-hide"></div>
  </header>

  <!-- Menu Items -->
  <main class="max-w-lg mx-auto px-4 py-4" id="menuList"></main>

  <!-- Cart Bar -->
  <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg hidden z-30">
    <div class="max-w-lg mx-auto px-4 py-3">
      <div class="flex items-center justify-between mb-2">
        <button onclick="toggleCart()" class="text-sm text-orange-600 font-medium">
          <span id="cartCount">0</span> آیتم — مشاهده سبد
        </button>
        <span class="font-bold text-orange-600" id="cartTotal">۰ تومان</span>
      </div>
      <button onclick="submitOrder()" id="submitBtn" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-3 rounded-xl transition">
        ثبت سفارش
      </button>
    </div>
  </div>

  <!-- Cart Drawer -->
  <div id="cartDrawer" class="fixed inset-0 bg-black/40 z-40 hidden" onclick="toggleCart()">
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl max-h-[70vh] overflow-y-auto" onclick="event.stopPropagation()">
      <div class="p-4 border-b flex justify-between items-center sticky top-0 bg-white">
        <h3 class="font-bold">سبد سفارش</h3>
        <button onclick="toggleCart()" class="text-gray-400 text-xl">×</button>
      </div>
      <div id="cartItems" class="p-4 space-y-3"></div>
      <div class="p-4 border-t">
        <label class="text-xs text-gray-500">یادداشت برای آشپز (اختیاری)</label>
        <input id="orderNote" class="w-full border rounded-lg px-3 py-2 text-sm mt-1 outline-none focus:ring-2 focus:ring-orange-300" placeholder="مثلاً: بدون پیاز، تند باشد...">
      </div>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="successModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center">
    <div class="bg-white rounded-2xl p-8 max-w-sm mx-4 text-center">
      <div class="text-5xl mb-4">✅</div>
      <h3 class="font-bold text-xl mb-2">سفارش ثبت شد!</h3>
      <p class="text-gray-500 text-sm mb-6">سفارش شما به آشپزخانه ارسال شد.</p>
      <button onclick="location.reload()" class="bg-orange-600 text-white px-6 py-2.5 rounded-xl">سفارش جدید</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const rid = params.get('r');
    const tableId = params.get('t');
    const tableLabel = params.get('n') || 'میز';

    if (!rid) {
      document.body.innerHTML = '<div class="text-center mt-20 text-gray-500">لینک نامعتبر است</div>';
      throw new Error('no rid');
    }

    document.getElementById('tableLabel').textContent = tableLabel ? `سفارش برای ${decodeURIComponent(tableLabel)}` : '';

    let menuData = null;
    let cart = {}; // itemId -> {item, qty}
    let activeCat = 'all';

    async function loadMenu() {
      const res = await fetch(`/api/menu/${rid}`);
      menuData = await res.json();
      if (!res.ok) {
        document.body.innerHTML = `<div class="text-center mt-20 text-red-500">${menuData.error}</div>`;
        return;
      }
      document.getElementById('restoTitle').textContent = menuData.restaurant.name;
      renderCats();
      renderItems();
    }

    function renderCats() {
      const bar = document.getElementById('catBar');
      bar.innerHTML = `
        <button onclick="setCat('all')" class="cat-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm ${activeCat==='all'?'cat-active':'bg-gray-100 text-gray-600'}">همه</button>
        ${menuData.categories.map(c => `
          <button onclick="setCat('${c.id}')" class="cat-btn whitespace-nowrap px-4 py-1.5 rounded-full text-sm ${activeCat===c.id?'cat-active':'bg-gray-100 text-gray-600'}">${c.name}</button>
        `).join('')}
      `;
    }

    function setCat(id) {
      activeCat = id;
      renderCats();
      renderItems();
    }

    function renderItems() {
      const list = document.getElementById('menuList');
      let items = menuData.items;
      if (activeCat !== 'all') items = items.filter(i => i.category_id === activeCat);

      if (!items.length) {
        list.innerHTML = '<p class="text-center text-gray-400 mt-10">موردی یافت نشد</p>';
        return;
      }

      list.innerHTML = items.map(i => {
        const qty = cart[i.id]?.qty || 0;
        return `
          <div class="bg-white rounded-xl shadow-sm p-4 mb-3 flex gap-3">
            <div class="w-16 h-16 bg-orange-50 rounded-xl flex items-center justify-center text-2xl shrink-0">🍲</div>
            <div class="flex-1 min-w-0">
              <h3 class="font-medium text-gray-800">${i.name}</h3>
              <p class="text-xs text-gray-400 mt-0.5 line-clamp-1">${i.description || ''}</p>
              <div class="flex items-center justify-between mt-2">
                <span class="text-orange-600 font-bold text-sm">${Number(i.price).toLocaleString('fa-IR')} ت</span>
                <div class="flex items-center gap-2">
                  ${qty > 0 ? `
                    <button onclick="changeQty('${i.id}', -1)" class="w-7 h-7 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center text-lg leading-none">−</button>
                    <span class="w-5 text-center font-medium text-sm">${qty}</span>
                  ` : ''}
                  <button onclick="changeQty('${i.id}', 1)" class="w-7 h-7 rounded-full bg-orange-600 text-white flex items-center justify-center text-lg leading-none">+</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function changeQty(id, delta) {
      const item = menuData.items.find(i => i.id === id);
      if (!item) return;
      if (!cart[id]) cart[id] = { item, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];
      renderItems();
      updateCartBar();
    }

    function updateCartBar() {
      const entries = Object.values(cart);
      const count = entries.reduce((s, e) => s + e.qty, 0);
      const total = entries.reduce((s, e) => s + e.item.price * e.qty, 0);
      const bar = document.getElementById('cartBar');
      if (count === 0) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      document.getElementById('cartCount').textContent = count;
      document.getElementById('cartTotal').textContent = total.toLocaleString('fa-IR') + ' تومان';
    }

    function toggleCart() {
      const drawer = document.getElementById('cartDrawer');
      const isHidden = drawer.classList.contains('hidden');
      if (isHidden) {
        const itemsDiv = document.getElementById('cartItems');
        const entries = Object.values(cart);
        itemsDiv.innerHTML = entries.map(e => `
          <div class="flex justify-between items-center">
            <div>
              <span class="font-medium text-sm">${e.item.name}</span>
              <span class="text-xs text-gray-400"> × ${e.qty}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm text-orange-600">${(e.item.price * e.qty).toLocaleString('fa-IR')}</span>
              <button onclick="changeQty('${e.item.id}', -1); toggleCart(); toggleCart();" class="text-red-400 text-xs">حذف</button>
            </div>
          </div>
        `).join('') || '<p class="text-gray-400 text-sm">سبد خالی است</p>';
      }
      drawer.classList.toggle('hidden');
    }

    async function submitOrder() {
      const entries = Object.values(cart);
      if (!entries.length) return;

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'در حال ثبت...';

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            restaurant_id: rid,
            table_id: tableId,
            table_label: decodeURIComponent(tableLabel || 'میز'),
            note: document.getElementById('orderNote').value,
            items: entries.map(e => ({
              item_id: e.item.id,
              name: e.item.name,
              price: e.item.price,
              qty: e.qty
            }))
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'خطا');

        document.getElementById('successModal').classList.remove('hidden');
        document.getElementById('successModal').classList.add('flex');
      } catch (e) {
        alert('خطا در ثبت سفارش: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'ثبت سفارش';
      }
    }

    loadMenu();
  </script>
</body>
</html>
