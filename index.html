<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم مدیریت رستوران</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', Tahoma, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-orange-50 to-amber-100 min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-16">
    <div class="text-center mb-12">
      <h1 class="text-4xl font-bold text-orange-800 mb-3">🍽️ سیستم مدیریت رستوران</h1>
      <p class="text-gray-600 text-lg">منوی دیجیتال • سفارش با QR • داشبورد آشپزخانه</p>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <!-- ورود رستوران -->
      <div class="bg-white rounded-2xl shadow-lg p-8">
        <h2 class="text-xl font-bold text-gray-800 mb-6">ورود به پنل رستوران</h2>
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-sm text-gray-600 mb-1">نام کاربری</label>
            <input type="text" id="loginUser" value="demo" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-orange-400 focus:border-orange-400 outline-none" required>
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">رمز عبور</label>
            <input type="password" id="loginPass" value="1234" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-orange-400 focus:border-orange-400 outline-none" required>
          </div>
          <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-2.5 rounded-lg transition">ورود</button>
        </form>
        <p id="loginError" class="text-red-500 text-sm mt-3 hidden"></p>
      </div>

      <!-- ثبت‌نام -->
      <div class="bg-white rounded-2xl shadow-lg p-8">
        <h2 class="text-xl font-bold text-gray-800 mb-6">ثبت‌نام رستوران جدید</h2>
        <form id="regForm" class="space-y-4">
          <div>
            <label class="block text-sm text-gray-600 mb-1">نام رستوران</label>
            <input type="text" id="regName" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-orange-400 outline-none" required>
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">نام کاربری</label>
            <input type="text" id="regUser" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-orange-400 outline-none" required>
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">رمز عبور</label>
            <input type="password" id="regPass" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-orange-400 outline-none" required>
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition">ثبت‌نام</button>
        </form>
        <p id="regError" class="text-red-500 text-sm mt-3 hidden"></p>
      </div>
    </div>

    <div class="mt-10 text-center text-sm text-gray-500">
      <p>برای تست: نام کاربری <b>demo</b> و رمز <b>1234</b></p>
    </div>
  </div>

  <script>
    async function api(url, method = 'GET', body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(url, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'خطا');
      return data;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('loginError');
      err.classList.add('hidden');
      try {
        const data = await api('/api/login', 'POST', {
          username: document.getElementById('loginUser').value,
          password: document.getElementById('loginPass').value
        });
        localStorage.setItem('resto_token', data.token);
        localStorage.setItem('resto_name', data.name);
        localStorage.setItem('resto_id', data.id);
        location.href = '/admin.html';
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('hidden');
      }
    });

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('regError');
      err.classList.add('hidden');
      try {
        const data = await api('/api/register', 'POST', {
          name: document.getElementById('regName').value,
          username: document.getElementById('regUser').value,
          password: document.getElementById('regPass').value
        });
        localStorage.setItem('resto_token', data.token);
        localStorage.setItem('resto_name', data.name);
        localStorage.setItem('resto_id', data.id);
        location.href = '/admin.html';
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
